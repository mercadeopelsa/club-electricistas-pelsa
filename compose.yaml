services:
  club:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      APP_URL: ${APP_URL:?Define APP_URL with the public HTTPS address}
      DATA_KEY: ${DATA_KEY:?Generate and back up DATA_KEY}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
    volumes:
      - club-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  club-data:
